<style>
:root{--bg:#000;--card:#1C1C1E;--s2:#2C2C2E;--sep:#38383A;--t1:#FFF;--t2:#8E8E93;--blue:#0A84FF;--green:#30D158;--orange:#FF9F0A;--red:#FF453A;--purple:#BF5AF2;--teal:#64D2FF;--yellow:#FFD60A;
--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--t1)}
body{font-family:-apple-system,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.sbar{position:fixed;top:0;left:0;right:0;height:var(--sat);background:#000;z-index:40}
.wrap{max-width:620px;margin:0 auto;padding:calc(var(--sat) + 14px) calc(var(--sar) + 16px) calc(var(--sab) + 48px) calc(var(--sal) + 16px)}
.lt{font-family:-apple-system,"SF Pro Display",Inter,sans-serif;font-size:34px;font-weight:800;letter-spacing:-.6px;margin:6px 0 4px;line-height:1.1}
h2{font-size:22px;font-weight:700;letter-spacing:-.3px;margin:26px 4px 10px}
h3{font-size:17px;font-weight:600;margin:0 0 8px}
.sub{color:var(--t2);font-size:15px}
.small{font-size:13px;color:var(--t2)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* header */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:8px}
.count{text-align:right}
.count b{display:block;font-family:-apple-system,"SF Pro Display",Inter,sans-serif;font-size:44px;line-height:1;color:var(--red);font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:var(--t2)}
/* segmented */
.seg{display:flex;background:var(--s2);border-radius:12px;padding:2px;gap:2px}

  setCal(S.hist[S.hist.length-1].a);
  ['extras','adj','rest','noAdj'].forEach(k=>{if(!S[k])S[k]=EMPTYX()[k];});
  const plans=S.hist.map(h=>buildPlan(h.a,profile(h.a),S.repeats||[]));
  const last=plans[plans.length-1];
  S.plan=last.weeks.map((W,i)=>{let k=0;S.hist.forEach((h,j)=>{if(h.from<=W.n)k=j;});return plans[k].weeks[i];});
  S.answers=S.hist[S.hist.length-1].a;S.meta=last.meta;
  try{const la=S.hist[S.hist.length-1].a;const base=buildPlan(la,profile(la),S.repeats||[],{noReal:true});S.baseVols=base.weeks.map(W=>W.vol);}catch(e){S.baseVols=null;}
  profile(S.answers);
}

    try{const v=snap&&(typeof snap.data==='function'?snap.data():snap);if(v&&v.json)remote=norm(JSON.parse(v.json));}catch(e){}
    if(remote&&(remote.savedAt||0)>(S.savedAt||0)&&(remote.hist.length||remote.draft)){

const RIE=1.06, HMK=21.0975;

i:{easy:['5:45','6:25'],long:['5:35','6:15'],r10:['4:58','5:08'],r21:['5:10','5:22'],r42:['5:30','5:45'],thr:['4:52','5:04'],int:['4:32','4:44']},
a:{easy:['4:55','5:30'],long:['4:45','5:20'],r10:['4:08','4:16'],r21:['4:18','4:28'],r42:['4:35','4:48'],thr:['4:06','4:16'],int:['3:48','3:58']}};

let HRZ={easy:[65,78],long:[68,80],hm:[83,88],thr:[86,91],int:[91,96]};

long:{n:'Tirada larga',rpe:'4-5',feel:'Hablas con frases completas.',why:'Resistencia.',c:'#0A84FF'},

function levelOf(a){
  if(a.running==='no')return 'b';
  const km=+a.kmWeek||0,lr=+a.longRun||0,y=a.years;
  if(km<15||lr<8||y==='<6m')return 'b';
  const t10=a.best==='10k'?+a.bestTime:(a.dist==='10'&&a.didRace==='si'?+a.tRace:0);
  if((km>=35&&lr>=14&&y==='>3y')||(t10&&t10<2520&&km>=30))return 'a';
  return 'i';
}
function profile(a){
  fixA(a);const cfg=DCFG[a.dist]||DCFG['21'],K=cfg.km;
  ZI.hm.n='Ritmo '+cfg.lab;HRZ.hm=cfg.hr.slice();
  const lv=levelOf(a),P={lv,a,cfg};
  let ref=null;
  if(a.running!=='no'){
    if((a.best==='5k'||a.best==='10k'||a.best==='21k')&&+a.bestTime>0){const D={'5k':5,'10k':10,'21k':HMK}[a.best];ref={D,T:+a.bestTime,lab:'Marca de '+a.best.toUpperCase()+': '+hms(+a.bestTime)};}
    else if(a.didRace==='si'&&+a.tRace>0)ref={D:K,T:+a.tRace,lab:'Marca de '+cfg.lab+': '+hms(+a.tRace)};
  }
  P.ref=ref;P.est=!ref;
  const pace={};
  if(ref){
    const pM=riegel(ref.T,ref.D,42.195)/42.195,p5=riegel(ref.T,ref.D,5)/5,pR=riegel(ref.T,ref.D,K)/K;
    const d60=ref.D*Math.pow(3600/ref.T,1/RIE),pU=3600/d60;
    pace.easy=[pM+25,pM+60];pace.long=[pM+15,pM+45];pace.thr=[pU-3,pU+5];pace.int=[p5-3,p5+4];pace.hm=[pR-3,pR+3];
    P.pred=pR*K;
  }else{
    const e=EST[lv];['easy','long','thr','int'].forEach(k=>pace[k]=e[k].map(ps));pace.hm=e['r'+(a.dist||'21')].map(ps);
    P.pred=(pace.hm[0]+pace.hm[1])/2*K;
  }
  if(a.dist==='42'&&(a.running==='no'||(+a.longRun||0)<20))P.pred*=1.05;
  const wk=Math.max(1,weeksFor(a));
  const imp={b:.07,i:.05,a:.03}[lv]*Math.min(1,wk/16);P.imp=imp;
  const fastest=P.pred/(1+imp);P.fastest=Math.ceil(fastest/60)*60;let target;P.goalWarn=null;
  if(a.goal==='finish')target=P.pred*cfg.finish;
  else{
    const G=+a.goalTime||0;
    if(a.goal==='improve'&&!G){const base=Math.min(+a.tRace||P.pred,P.pred);target=Math.ceil(Math.max(fastest,base*(1-imp/2))/60)*60;}
    else if(G<fastest-cfg.margin){target=P.fastest;P.goalWarn={t:'fast',G,target};}
    else{target=G;if(G>P.pred*1.06)P.goalWarn={t:'slow',G};}
  }
  P.timeOk=!(P.goalWarn&&P.goalWarn.t==='fast');
  P.target=target;P.tp=target/K;
  if(ref&&a.goal!=='finish')pace.hm=[P.tp-2,P.tp+3];
  P.pace=pace;
  P.hrmax=Math.round(208-.7*(+a.age||35));
  P.hr={};for(const z in HRZ)P.hr[z]=HRZ[z].map(p=>Math.round(P.hrmax*p/100));
  P.rpeOnly=a.device==='none';
  P.mid=z=>(pace[z][0]+pace[z][1])/2;
  return P;
}
function zi(P,z,o){return Object.assign({z,n:ZI[z].n,pace:P.pace[z].slice(),hr:P.hr[z].slice(),rpe:ZI[z].rpe,feel:ZI[z].feel},o||{});}

const DEFD={2:[2,6],3:[1,3,6],4:[1,3,5,6],5:[0,1,3,5,6],6:[0,1,2,3,5,6]};
const cd=(a,b)=>{const d=Math.abs(a-b)%7;return Math.min(d,7-d);};
function combos(arr,k){const out=[];(function r(s,c){if(c.length===k){out.push(c.slice());return;}for(let i=s;i<arr.length;i++){c.push(arr[i]);r(i+1,c);c.pop();}})(0,[]);return out;}
function spread(c,k,must){
  c=[...new Set(c)].sort((x,y)=>x-y);if(c.length<=k)return c;
  let best=null,bs=-1e9;
  for(const s of combos(c,k)){
    if(must!=null&&c.includes(must)&&!s.includes(must))continue;
    const g=s.map((v,i)=>i<s.length-1?s[i+1]-v:7-v+s[0]);
    const sc=Math.min(...g)*1000-g.reduce((t,x)=>t+x*x,0);
    if(sc>bs){bs=sc;best=s;}
  }
  return best;
}
function schedule(a,lv){
  const n=+a.days;let ld=a.longDay===''||a.longDay==null?6:+a.longDay;let train;
  const pref=(a.prefDays||[]).map(Number);
  if(pref.length){
    train=spread(pref,n,pref.includes(ld)?ld:null);
    if(!train.includes(ld)){let b=train[train.length-1],bd=99;for(const d of train){const dd=cd(d,ld)-(d>=5?.5:0);if(dd<bd){bd=dd;b=d;}}ld=b;}
  }else{
    train=DEFD[n].slice();
    if(!train.includes(ld)){let bi=0,bd=99;train.forEach((d,i)=>{const dd=cd(d,ld);if(dd<bd){bd=dd;bi=i;}});train[bi]=ld;train=[...new Set(train)].sort((x,y)=>x-y);}
  }
  const rd=Math.min(train.length,{b:4,i:5,a:6}[lv]);
  const run=spread(train,rd,ld);
  return {train,ld,run,rd,extra:train.filter(d=>!run.includes(d))};
}
function pickQ(run,ld,n){
  const c=run.filter(d=>d!==ld&&d!==(ld+1)%7&&d!==(ld+6)%7);
  if(n<=0||!c.length)return [];
  const srt=c.slice().sort((x,y)=>cd(y,ld)-cd(x,ld)||x-y);
  if(n===1)return [srt[0]];
  let best=null,bs=-1;
  for(const p of combos(c,2)){if(cd(p[0],p[1])<2)continue;const s=Math.min(cd(p[0],ld),cd(p[1],ld))*10+cd(p[0],p[1]);if(s>bs){bs=s;best=p;}}
  return best?best.sort((x,y)=>x-y):[srt[0]];
}
function pickS(ld,extra,qd,easy,n){
  const bad=new Set([ld,(ld+6)%7]);const seen=new Set();const c=[];
  [[extra,0],[qd,1],[easy,3]].forEach(([arr,p])=>arr.forEach(d=>{if(!bad.has(d)&&!seen.has(d)){seen.add(d);c.push({d,p});}}));
  if(!c.length||n<=0)return [];
  const k=Math.min(n,c.length);let best=null,bs=-1e9;
  for(const s of combos(c,k)){const g=k>1?cd(s[0].d,s[1].d):7;const sc=(g>=2?100:0)-s.reduce((t,x)=>t+x.p,0)*10+g;if(sc>bs){bs=sc;best=s;}}
  return best;
}

function qS(id,day,type,step,P,dayMax,fixed){
  const pc=P.pace,M=z=>P.mid(z),eM=M('easy');
  const wu=P._short?[10,5]:[15,10];

  const cool=`${wu[1]} min suaves a ${pr(pc.easy)}`;
  const build=st=>{

    if(type==='fartlek'){const[n,on,off]=FART[st];title='Fartlek';main.push(`${n} x ${fm(on)} vivo (ritmo umbral) / ${fm(off)} trote suave`);zones=[zi(P,'thr')];mm=n*(on+off);km=n*on*60/M('thr')+n*off*60/eM;reps.push(`Cada tramo de ${fm(on)} ≈ ${dist(on*60/M('thr'))}`);}
    else if(type==='hills'){const[n,s]=HILL[st];title='Cuestas';main.push(`${n} x ${s} s subiendo una cuesta del 5-8 % a esfuerzo fuerte`,'Recuperación: bajar trotando muy suave');zones=[zi(P,'int',{n:'Cuesta',pace:null})];mm=n*s*2.5/60;km=n*(s/(M('int')+40)+s*1.5/eM);reps.push('En cuesta manda el esfuerzo (RPE 8): el ritmo no sirve de referencia.');}

    else if(type==='int'){const[n,dm,rec]=LISTS.int[st];title='Series';main.push(`${n} x ${dm} m a ritmo de series, recuperación ${fm(rec)} trote suave`);zones=[zi(P,'int')];const t=M('int')*dm/1000;mm=(n*t+(n-1)*rec*60)/60;km=n*dm/1000+(n-1)*rec*60/eM;reps.push(`${dm} m en ${mmss(pc.int[0]*dm/1000)}-${mmss(pc.int[1]*dm/1000)}`);}
    else{const[n,k,rec]=fixed||LISTS.hm[st];title=fixed?'Ritmo '+DIST.lab+' reducido':'Ritmo '+DIST.lab;main.push(n===1?`${nf(k,1)} km seguidos a ritmo ${DIST.lab}`:`${n} x ${nf(k,1)} km a ritmo ${DIST.lab}, recuperación ${rec} min trote suave`);zones=[zi(P,'hm')];mm=(n*k*M('hm')+(n-1)*rec*60)/60;km=n*k+(n-1)*rec*60/eM;
      reps.push(`Cada km en ${mmss(pc.hm[0])}-${mmss(pc.hm[1])}`);if(k>1)reps.push(`${nf(k,1)} km en ${hms(pc.hm[0]*k)}-${hms(pc.hm[1]*k)}`);}

}

 calf:{base:'3 x 12, 3 s bajando',dev:'4 x 8, con carga',spec:'3 x 8, con carga',taper:'2 x 8, ligero'},tib:{base:'3 x 15',dev:'3 x 15',spec:'3 x 12',taper:'2 x 12'},cop:{base:'3 x 15 s por lado',dev:'3 x 20 s por lado',spec:'3 x 20 s por lado',taper:'2 x 15 s por lado'},

/* ========= Avisos ========= */
function warnings(a,P,meta){
  const W=[];const push=(c,t,x)=>W.push({c,t,x});
  if(a.medical==='si')push('red','Necesitas autorización médica','Has indicado una condición médica o medicación que afecta al esfuerzo'+(a.medText?' ('+esc(a.medText)+')':'')+'. Consulta con tu médico antes de empezar y llévale este plan.');
  if(a.pain==='si')push('red','Molestias actuales'+(a.painWhere?': '+esc(a.painWhere):''),'Consulta con un fisioterapeuta. Regla del dolor: puedes entrenar con molestias de hasta 3/10 si no empeoran durante la sesión y desaparecen en 24 h. Si no se cumple, para. El plan arranca más suave, sin calidad las 3 primeras semanas y sin pliometría hasta la fase específica.');
  if(a.injury==='si'&&a.injResolved==='no')push('orange','Lesión sin resolver'+(a.injZone?': '+esc(a.injZone):''),'Termina la recuperación antes de meter calidad. Si la zona da guerra, quita la sesión de calidad de esa semana.');
  if(P.goalWarn&&P.goalWarn.t==='slow')push('blue','Objetivo conservador',`Tu predicción es ${hms(P.pred)}${P.est?' (estimada)':''} y tu objetivo ${hms(P.goalWarn.G)}. Es prudente; si todo va bien, podrás revisarlo al alza.`);
  if(+a.days===2)push('orange','Solo 2 días por semana','Da para terminar, pero no para mucho más. Las dos sesiones cuentan doble: no te saltes ninguna y protege el descanso entre ellas.');
  if(a.sleep==='<6'||a.stress==='alto')push('blue','Sueño y estrés','Con poco sueño o estrés alto el cuerpo asimila peor la carga. El plan sube más despacio (6 % por semana). Si una noche duermes muy mal, cambia la calidad por un rodaje suave.');
  if(P.est)push('blue','Plan sin marca: ritmos estimados',meta.testWeek?`Los ritmos son estimados por nivel. En la semana ${meta.testWeek} tienes un test de 5K; mete el tiempo en "Editar respuestas" y el plan se recalcula.`:'Los ritmos son estimados por nivel. Cuando puedas correr 5 km seguidos, haz un test y mete el tiempo en "Editar respuestas".');
  if(a.running==='no')push('blue','Vuelves a entrenar','Las primeras semanas son para que tendones y huesos se adapten. Van por detrás del corazón y los pulmones: aunque te sientas con fuerzas, no adelantes etapas.');
  if(meta.ldMoved)push('blue','Tirada larga movida',`El día que elegiste para la tirada larga no está entre tus días; va el ${DAYS[meta.sch.ld].toLowerCase()}.`);

}

/* ========= Registro ========= */
const RUNT=new Set(['easy','long','quality','test','rw','race','act','extra']);

function proposals(){

  if(cw>=2&&cw<PB.TS&&!dis['wk'+cw]&&!(S.repeats||[]).some(r=>r.at===cw)){

    if(prev.n&&prev.pct<.5){let base=1;for(let w=cw-1;w>=1;w--){if(weekStats(S.plan[w-1]).pct>=.5){base=w;break;}}
      out.push({k:'week',id:'wk'+cw,at:cw,base,pct:prev.pct});}
  }
  const W=S.plan[cw-1];
  const occ=d=>W.sessions.some(x=>!x.optional&&dayOf(x)===d);
  const long=W.sessions.find(x=>x.type==='long');const ld=long?dayOf(long):null;
  const qDays=W.sessions.filter(x=>x.type==='quality'||x.type==='test').map(dayOf);const drops=[];
  W.sessions.forEach(s=>{
    if(s.optional||s.extra||s.type==='race'||dis[s.id])return;
    const l=S.log[s.id],d=dayOf(s),date=dDate(W.n,d),skip=l&&l.st==='skip';

    for(let x=from;x<=6;x++){if(+dDate(W.n,x)<+t||occ(x))continue;c.push(x);}
    let to=null;
    if(s.type==='quality'||s.type==='test')to=c.find(x=>ld==null||(x!==ld&&Math.abs(x-ld)>1&&!qDays.some(q=>q!==d&&Math.abs(q-x)<=1)));
    else if(s.type==='long')to=c.find(x=>!qDays.some(q=>q!==d&&q===x+1));

}

function leverList(a,ev){

  if(lim>=1){const pts=done.slice(0,lim).map((v,i)=>`${pl+i*bw+bw/2},${y(v)}`).join(' ');g+=`<polyline points="${pts}" fill="none" stroke="#30D158" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`+done.slice(0,lim).map((v,i)=>`<circle cx="${pl+i*bw+bw/2}" cy="${y(v)}" r="3" fill="#30D158"/>`).join('');}
  return `<div class="card chart"><h3>Volumen semanal (km)</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Volumen semanal planificado por fase y kilómetros hechos">${g}</svg><div class="legend">${Object.values(PH).map(p=>`<span><i style="background:${p.c}"></i>${p.n}</span>`).join('')}<span><i style="background:#30D158;height:3px;vertical-align:3px"></i>Km hechos</span></div></div>`;
}
function rulesHTML(){
  return `<h2>Normas generales</h2><div class="card rules">
  <h3>Cuándo bajar la carga</h3><p>Si dos rodajes suaves seguidos te cuestan (RPE 6 o más), duermes mal varias noches, tienes el pulso en reposo 7 ppm o más por encima de lo habitual o notas las piernas pesadas 3 días seguidos: quita la calidad de esa semana y acorta los rodajes un 20-30 %. Una semana floja no estropea un plan; una lesión sí.</p>
  <h3>Dolor que no se puede ignorar</h3><p>Para y consulta si el dolor te cambia la forma de correr, sube por encima de 3/10 durante la sesión, sigue al día siguiente, aparece en un punto concreto del hueso (tibia, pie, cadera) o se acompaña de hinchazón. Hasta 3/10, si no empeora y desaparece en 24 h, puedes seguir.</p>
  <h3>Agua</h3><p>Bebe según la sed. Lleva agua en las sesiones de más de 60-75 min.</p>
  <h3>Descanso</h3><p>Al menos un día completo sin correr por semana. Dormir 7-9 h es parte del entrenamiento. Nunca recuperes una sesión perdida juntando dos en el mismo día.</p>

}

function lineChart(title,series,opt){
  const W=340,H=160,pl=30,pb=22,pt=10,n=NW,bw=(W-pl-4)/n;
  const mx=opt.max||Math.max(10,...series.flatMap(s=>s.v.filter(x=>x!=null)))*1.12,y=v=>pt+(H-pt-pb)*(1-v/mx);
  let g='';
  (opt.ticks||[0,Math.round(mx/2.24),Math.round(mx/1.12)]).forEach(v=>{g+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#38383A"/><text x="${pl-5}" y="${y(v)+4}" fill="#8E8E93" font-size="10" text-anchor="end">${v}</text>`;});
  if(opt.band)g+=`<rect x="${pl}" y="${y(opt.band[1])}" width="${W-pl}" height="${y(opt.band[0])-y(opt.band[1])}" fill="#30D158" opacity=".12"/>`;
  (opt.bands||[]).forEach(([a0,a1,c])=>{g+=`<rect x="${pl}" y="${y(a1)}" width="${W-pl}" height="${y(a0)-y(a1)}" fill="${c}" opacity=".13"/>`;});
  for(let i=0;i<n;i++)if(i===0||i%3===0||i===n-1)g+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" fill="#8E8E93" font-size="10" text-anchor="middle">S${i+1}</text>`;
  series.forEach(s=>{
    if(s.bar){const off=s.off||0;s.v.forEach((v,i)=>{if(v==null||v<=0)return;g+=`<rect x="${pl+i*bw+bw*(.12+off)}" y="${y(v)}" width="${bw*.36}" height="${y(0)-y(v)}" rx="2" fill="${s.c}"/>`;});}
    else{const pts=s.v.map((v,i)=>v==null?null:[pl+i*bw+bw/2,y(v)]).filter(Boolean);if(pts.length)g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.c}"/>`).join('');}
  });
  return `<div class="card chart"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}${opt.band?'<span><i style="background:#30D158;opacity:.35"></i>Zona RPE 3-4</span>':''}</div></div>`;
}

  if(p.paceP){const P=profile(S.answers);h+=p.paceP.k==='fast'?`<div class="alert" style="--c:var(--blue)"><b>Tus rodajes suaves salen más rápidos</b><p>En tus 3 últimos rodajes suaves has ido a ${mmss(p.paceP.avg)} /km de media con RPE 4 o menos, por debajo de tu rango (${pr(P.pace.easy)}). Propuesta: actualizar tus ritmos como si hubieras hecho un 5K en ${hms(p.paceP.T5)}.</p><div class="row" style="margin-top:10px"><button class="btn" style="min-height:44px;font-size:15px" data-a="paceUp" data-v="${p.paceP.T5}">Actualizar ritmos</button></div></div>`:`<div class="alert" style="--c:var(--yellow)"><b>Tus rodajes suaves salen lentos y duros</b><p>${mmss(p.paceP.avg)} /km de media con RPE 5 o más. El ritmo suave es un techo, no un objetivo: si cuesta, ve más lento. Revisa el sueño y la carga.</p></div>`;}
  {const ws=S.plan;const real=p.ws.map((x,i)=>i<=ci?x.km:null),plan=ws.map(W=>W.vol);
   h+=lineChart('Km semanales: reales frente a previstos',[{n:'Reales',c:'#30D158',bar:1,v:real},{n:'Previstos',c:'#8E8E93',v:plan}],{});
   const r0=riskNow();if(r0){const base=baseOf(S.answers,S.plan),ser=seriesOf(S.plan,S.answers);const ac=S.plan.map(W=>{const e=addD(wStart(W.n),6),d=e<today0()?e:today0();if(wStart(W.n)>today0())return null;return Math.round(acwrAt(ser,base,d).rk*100)/100;});
     h+=lineChart('ACWR por semana (km)',[{n:'ACWR',c:'#0A84FF',v:ac}],{max:2,ticks:[0,0.8,1.3,1.5,2],bands:[[0.8,1.3,'#30D158'],[1.3,1.5,'#FF9F0A'],[1.5,2,'#FF453A']]});}
   const pains=logsOf(S.plan,today0()).filter(x=>+x.l.pain>0).slice(-10).reverse();

  h+=lineChart('Carga semanal: real frente a prevista (UA)',[{n:'Prevista',c:'#48484A',bar:1,v:p.ws.map(x=>x.plan)},{n:'Real',c:'#0A84FF',bar:1,off:.4,v:p.ws.map((x,i)=>i<=ci?x.load:null)}],{});
  h+=lineChart('RPE medio por semana',[{n:'RPE medio',c:'#FFD60A',v:p.ws.map(x=>x.rpe)}],{max:10,ticks:[0,5,10],band:[3,4]});
  h+=`<div class="card small">Carga de sesión = RPE x minutos (sRPE de Foster). Carga prevista = minutos previstos x RPE esperado (rodaje 3,5; tirada larga 4,5; calidad 6,5; test 9; fuerza 5; carrera 8).</div>`;
  return h;
}

/* ========= Hojas y avisos ========= */
function toast(t){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function sheet(html){document.getElementById('layer').innerHTML=`<div class="ovl" data-a="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;}
function closeSheet(){document.getElementById('layer').innerHTML='';}
async function copyText(t){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);return true;}}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);const ok=document.execCommand('copy');ta.remove();return ok;}catch(e){return false;}
}
function planText(){
  const a=S.answers,P=profile(a);const L=[];
  L.push('EntrenApp Run · Plan de '+a.name,a.raceName+' · '+DCFG[a.dist].lab+' · '+fmtL(RACE),'');
  L.push(`Nivel: ${LV[P.lv]} · Objetivo: ${hms(P.target)} (${mmss(P.tp)} /km) · Predicción: ${hms(P.pred)}${P.est?' (estimada)':''}`);
  L.push('Ritmos'+(P.est?' (estimados)':'')+':');
  ['easy','long','hm','thr','int'].forEach(z=>L.push(`  ${ZI[z].n}: ${pr(P.pace[z])} · ${spd(P.pace[z])} · ${P.hr[z][0]}-${P.hr[z][1]} ppm · RPE ${ZI[z].rpe}`));
  S.plan.forEach(W=>{
    L.push('',`SEMANA ${W.n} (${wRange(W.n)}) · ${PH[W.phase].n}${KIND[W.kind]?' · '+KIND[W.kind]:''} · ${nf(W.vol,1)} km`);
    W.sessions.slice().sort((x,y)=>dayOf(x)-dayOf(y)).forEach(s=>{
      const l=S.log[s.id];
      L.push(`  ${DAB[dayOf(s)]} ${fmtD(sDate(W,s))}: ${s.title}${s.km?' · '+nf(s.km,1)+' km':''} · ${s.min} min${l?(l.st==='done'?' [hecha'+(RUNT.has(s.type)?': '+nf(lkm(s,l),1)+' km':'')+(l.rpe?', RPE '+l.rpe:'')+(+l.pain>0?', dolor '+l.pain:'')+']':' [no hecha]'):''}`);
      if(s.warm)L.push('    Calentamiento: '+s.warm);
      if(s.circ)s.circ.forEach(c=>{L.push('    '+c.name);c.items.forEach(it=>L.push(`      - ${it.n}: ${it.d}`));});
      else s.main.forEach(m=>L.push('    - '+m));
      if(s.cool)L.push('    Vuelta a la calma: '+s.cool);
      (s.zones||[]).forEach(z=>L.push(`    ${z.n}: ${z.pace?pr(z.pace)+' · '+spd(z.pace)+' · ':''}${z.hr[0]}-${z.hr[1]} ppm · RPE ${z.rpe}`));
      (s.reps||[]).forEach(r=>L.push('    '+r));
    });
  });
  L.push('','Plan orientativo. No sustituye una valoración médica o profesional.');
  return L.join('\n');
}

function arm(key,btn,label,orig){
  if(UI.armed[key])return true;
  UI.armed[key]=true;if(btn){btn.textContent=label;btn.classList.add('armed');}
  setTimeout(()=>{UI.armed[key]=false;if(btn&&btn.isConnected){btn.textContent=orig;btn.classList.remove('armed');}},3500);

/* ========= Generar ========= */
function generate(){
  const a=JSON.parse(JSON.stringify(S.draft));
  ['age','kmWeek','longRun','daysNow','days','longDay','maxWeekday','maxWeekend','strengthDays','otherSports','tRace','bestTime','goalTime'].forEach(k=>{if(a[k]!==''&&a[k]!=null)a[k]=+a[k];});
  fixA(a);if(!DCFG[a.dist])a.dist='21';if(!a.raceDate)a.raceDate='2027-04-04';if(!a.raceName)a.raceName='Carrera';
  const Lh=S.hist.length?S.hist[S.hist.length-1].a:null;const sameStart=Lh&&Lh.startDate===a.startDate&&Lh.raceDate===a.raceDate&&Lh.dist===a.dist;
  setCal(a);a.lowWeeks=(a.lowWeeks||[]).filter(x=>{const n=dayDiff(START,parseISO(x))/7+1;return n>=1&&n<PB.TS;});
  if(S.hist.length&&UI.editing&&sameStart){
    let from=1;const t=today0();for(let w=1;w<=NW;w++){if(addD(wStart(w),6)<t)from=w+1;}
    from=Math.min(from,NW);
    S.hist=S.hist.filter(h=>h.from<from);S.hist.push({a,from});if(S.hist.length===1)S.hist[0].from=1;
  }else{S.hist=[{a,from:1}];S.log={};S.moves={};S.repeats=[];S.dismiss={};Object.assign(S,EMPTYX());}
  S.draft=null;rebuild();
  const ids=new Set();S.plan.forEach(W=>W.sessions.forEach(s=>ids.add(s.id)));
  for(const k in S.moves)if(!ids.has(k))delete S.moves[k];
  save();
  const cw=curWeek();UI.open=new Set([Math.min(Math.max(cw,1),19)]);UI.view='plan';UI.tab='plan';UI.editing=false;UI.step=0;
  render();window.scrollTo(0,0);
}

/* ========= Eventos ========= */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const A=b.dataset.a,id=b.dataset.id;
  if(A==='start'){S.draft=Object.assign({},JSON.parse(JSON.stringify(DEF)),{startDate:defStart()});UI.view='quiz';UI.step=0;UI.errs={};UI.editing=false;save();render();window.scrollTo(0,0);}
  else if(A==='set'){let v=b.dataset.v;if(/^\d+$/.test(v)&&['daysNow','days','longDay','strengthDays','otherSports'].includes(b.dataset.k))v=+v;S.draft[b.dataset.k]=v;delete UI.errs[b.dataset.k];save();render(true);}
  else if(A==='sw'){const k=b.dataset.k;S.draft[k]=S.draft[k]==='si'?'no':'si';save();render(true);}
  else if(A==='tog'){const k=b.dataset.k,v=k==='lowWeeks'?b.dataset.v:+b.dataset.v,arr=(S.draft[k]||[]).slice();const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);arr.sort((x,y)=>x-y);S.draft[k]=arr;delete UI.errs[k];save();render(true);}
  else if(A==='next'){UI.errs=validate(UI.step);if(Object.keys(UI.errs).length){render(true);const f=document.querySelector('.err');if(f)f.closest('.field').scrollIntoView({behavior:'smooth',block:'center'});return;}
    if(UI.step<Q.length-1){UI.step++;render();window.scrollTo(0,0);}else generate();}
  else if(A==='back'){UI.errs={};UI.step--;render();window.scrollTo(0,0);}
  else if(A==='cancelEdit'){S.draft=null;UI.editing=false;UI.view='plan';save();render();window.scrollTo(0,0);}
  else if(A==='tab'){UI.tab=b.dataset.v;render();window.scrollTo(0,0);}
  else if(A==='wk'){const w=+b.dataset.w;if(UI.open.has(w))UI.open.delete(w);else UI.open.add(w);render(true);}
  else if(A==='done'||A==='editLog'){const s0=findS(id),l=S.log[id];UI.lf={id,km:l&&l.km!=null?l.km:(s0.km||''),min:l&&l.min!=null?l.min:s0.min,paceTxt:l&&l.pace?mmss(l.pace):'',rpe:l?l.rpe:null,pain:l?+l.pain||0:0,zone:l?l.zone||'':'',note:l?l.note||'':''};render(true);}
  else if(A==='lfSet'){const k=b.dataset.k;UI.lf[k]=k==='zone'?b.dataset.v:+b.dataset.v;if(k==='pain'&&+b.dataset.v===0)UI.lf.zone='';UI.lf.err='';render(true);}
  else if(A==='lfCancel'){UI.lf=null;render(true);}
  else if(A==='lfSave'){const s0=findS(id),W=weekOfS(s0),f=UI.lf;
    if(!f.rpe){f.err='Elige el RPE para guardar.';render(true);return;}
    if(+f.pain>0&&!f.zone){f.err='Indica dónde te duele.';render(true);return;}
    if(RUNT.has(s0.type)&&(f.km===''||isNaN(+f.km))){f.err='Indica los km que corriste.';render(true);return;}
    logChange(()=>{S.log[id]=lfDraftLog(s0,W);if(S.noAdj)delete S.noAdj[W.n];},W.n);UI.lf=null;}
  else if(A==='skip'){const W=weekOfS(findS(id));logChange(()=>{S.log[id]={st:'skip',date:iso(sDate(W,findS(id)))};},W.n);}
  else if(A==='unlog'){const W=weekOfS(findS(id));logChange(()=>{delete S.log[id];},W.n);}
  else if(A==='rOk'||A==='rNo'){const x=riskAlerts().find(r=>r.key===b.dataset.k);if(!S.dismiss)S.dismiss={};S.dismiss[b.dataset.k]=1;if(x&&A==='rOk'){applyRisk(x);rebuild();toast('Plan ajustado');}save();render(true);}
  else if(A==='adjUndo'){if(S.lastAdj){S.noAdj[S.lastAdj.src]=true;S.lastAdj=null;rebuild();save();toast('Reajuste deshecho');}render(true);}
  else if(A==='adjOk'){S.lastAdj=null;save();render(true);}
  else if(A==='extraOpen'){UI.xd=null;UI.xkm=null;UI.xw=+b.dataset.w;extraSheet(UI.xw);}
  else if(A==='xDay'){UI.xd=+b.dataset.v;UI.xkm=null;extraSheet(UI.xw);}
  else if(A==='extraAdd'){const w=+b.dataset.w,km=+UI.xkm;if(!(km>0)){toast('Indica los km');return;}if(!S.extras[w])S.extras[w]=[];S.extras[w].push({id:'x'+w+'-'+Date.now().toString(36),day:UI.xd,km:r05(km)||km});rebuild();save();closeSheet();UI.open.add(w);render(true);toast('Día extra añadido el '+DAYS[UI.xd].toLowerCase());}
  else if(A==='xDel'){if(!arm('xdel'+id,b,'Pulsa otra vez','Quitar'))return;Object.keys(S.extras).forEach(w=>{S.extras[w]=S.extras[w].filter(x=>x.id!==id);});delete S.log[id];rebuild();save();render(true);}
  else if(A==='paceUp'){S.draft=fixA(JSON.parse(JSON.stringify(S.answers)));S.draft.best='5k';S.draft.bestTime=+b.dataset.v;if(S.draft.running==='no')S.draft.running='reg';UI.editing=true;generate();UI.tab='prog';render();toast('Ritmos actualizados');}
  else if(A==='solApply'){const v=viability(),o=v&&v.sols[+b.dataset.i];if(!o)return;S.draft=JSON.parse(JSON.stringify(o.x));UI.editing=true;generate();UI.tab='res';render();window.scrollTo(0,0);toast('Plan recalculado con el cambio');}
  else if(A==='pOk'||A==='pNo'){
    const p=proposals().find(x=>x.id===id);if(!S.dismiss)S.dismiss={};
    if(!p){render(true);return;}
    if(A==='pNo'){S.dismiss[id]=1;save();render(true);return;}
    if(p.k==='days'){S.draft=fixA(JSON.parse(JSON.stringify(S.answers)));S.draft.days=p.n+1;if(S.draft.prefDays&&S.draft.prefDays.length&&!S.draft.prefDays.includes(p.day))S.draft.prefDays=S.draft.prefDays.concat(p.day).sort((x,y)=>x-y);UI.editing=true;generate();UI.tab='res';render();toast('Plan recalculado con '+(p.n+1)+' días');return;}
    if(p.k==='move'){S.moves[p.s.id]=p.to;if(S.log[p.s.id]&&S.log[p.s.id].st==='skip')delete S.log[p.s.id];toast('Sesión movida al '+DAYS[p.to].toLowerCase());}
    else if(p.k==='drop'){p.list.forEach(i=>{S.log[i.s.id]={st:'skip',date:iso(today0())};});}
    else{if(!S.repeats)S.repeats=[];S.repeats=S.repeats.filter(r=>r.at!==p.at);S.repeats.push({at:p.at,base:p.base});
      for(const k in S.moves){const m=/^w(\d+)-/.exec(k);if(m&&+m[1]>=p.at)delete S.moves[k];}
      rebuild();toast('Plan recalculado desde la semana '+p.at);}
    save();render(true);}
  else if(A==='edit'){S.draft=fixA(JSON.parse(JSON.stringify(S.answers)));UI.editing=true;UI.view='quiz';UI.step=0;UI.errs={};render();window.scrollTo(0,0);}
  else if(A==='copy'){const t=planText();const ok=await copyText(t);if(ok)toast('Plan copiado al portapapeles');else sheet(`<h3>Copiar plan</h3><p class="small">Tu navegador no permite copiar directamente. Mantén pulsado el texto, selecciona todo y copia.</p><textarea readonly style="min-height:50vh">${esc(t)}</textarea><button class="btn sec" style="margin-top:10px" data-a="closeSheet">Cerrar</button>`);}
  else if(A==='backup')backupSheet();
  else if(A==='closeSheet')closeSheet();
  else if(A==='bkCopy'){const ok=await copyText(document.getElementById('bkOut').value);if(ok)toast('Copia copiada al portapapeles');else{const t=document.getElementById('bkOut');t.focus();t.select();toast('Selecciona el texto y cópialo');}}
  else if(A==='bkImport'){
    const err=document.getElementById('bkErr');err.textContent='';let d;
    try{d=JSON.parse(document.getElementById('bkIn').value.trim());}catch(x){err.textContent='El texto no es una copia válida.';return;}
    const nd=d&&d.app==='EntrenAppRun'?norm(d):null;
    if(!nd||!nd.hist.length){err.textContent='El texto no es una copia de EntrenApp Run.';return;}
    if(S.answers&&!arm('imp',b,'Pulsa otra vez para sustituir','Importar'))return;
    nd.draft=null;adopt(nd);save();closeSheet();
    UI.view='plan';UI.tab='plan';UI.open=new Set([openWk()]);render();window.scrollTo(0,0);toast('Copia importada');}
  else if(A==='reset'){
    if(!arm('reset',b,'Pulsa otra vez para borrar','Empezar de nuevo'))return;
    UI.armed.reset=false;S=Object.assign({v:2,hist:[],log:{},moves:{},draft:null,repeats:[],dismiss:{},savedAt:0},EMPTYX());try{localStorage.removeItem(KEY);}catch(x){}save();UI.view='welcome';render();window.scrollTo(0,0);}
});
function logChange(fn,wn){
  const before=S.plan.map(W=>({v:W.vol,l:W.Lplan||0}));fn();rebuild();
  let msg='Sesión guardada';
  for(let i=wn;i<S.plan.length;i++){const W=S.plan[i],b0=before[i];if(!b0)continue;if(Math.abs(W.vol-b0.v)>=.5||Math.abs((W.Lplan||0)-b0.l)>=.5){
    const txt=`La semana ${W.n} pasa de ${nf(b0.v,1)} a ${nf(W.vol,1)} km${Math.abs((W.Lplan||0)-b0.l)>=.5?` y la tirada larga de ${nf(b0.l,1)} a ${nf(W.Lplan,1)} km`:''}, y el resto del plan se recalcula desde ahí.`;
    S.lastAdj={src:wn,w:W.n,txt};msg='Plan reajustado: semana '+W.n+' a '+nf(W.vol,1)+' km';break;}}
  const wp=S.plan[wn-1];if(wp&&wp._held)msg='Guardado. No subo la carga: hay riesgo (mira Resumen)';
  save();render(true);toast(msg);
}
function findS(id){for(const W of S.plan)for(const s of W.sessions)if(s.id===id)return s;return null;}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.in){if(t.type==='date')return;S.draft[t.dataset.in]=t.tagName==='SELECT'?+t.value:t.value;t.classList.remove('bad');save();}
  else if(t.dataset.time){const k=t.dataset.time,box=t.closest('.tgrid'),g=p=>{const x=box.querySelector(`[data-p="${p}"]`);return x?x.value:'';};
    const h=g('h'),m=g('m'),s=g('s');S.draft[k]=(h===''&&m===''&&s==='')?'':(+h||0)*3600+(+m||0)*60+(+s||0);save();}
  else if(t.dataset.lf&&UI.lf){const k=t.dataset.lf;if(k==='pace')UI.lf.paceTxt=t.value;else UI.lf[k]=t.value;
    const s0=findS(UI.lf.id);const pv=document.getElementById('lfprev');if(pv)pv.innerHTML=lfPreview(s0);
    const pc=document.getElementById('lfpc');if(pc&&k!=='pace'){const km=+UI.lf.km,mn=+UI.lf.min;pc.textContent=km>0&&mn>0?'Calculado: '+mmss(mn*60/km)+' /km. Corrígelo si tu reloj dice otra cosa.':'Se calcula con los km y los minutos.';const pi=document.getElementById('lfpace');if(pi)pi.placeholder=km>0&&mn>0?mmss(mn*60/km):'';}}
  else if(t.dataset.x==='km'){UI.xkm=t.value;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.mv){const s=findS(t.dataset.mv),v=+t.value;if(v===s.day)delete S.moves[s.id];else S.moves[s.id]=v;save();render(true);toast('Sesión movida al '+DAYS[v].toLowerCase());}
  else if(t.dataset.in&&t.tagName==='SELECT'){S.draft[t.dataset.in]=+t.value;save();}
  else if(t.dataset.in==='startDate'||t.dataset.in==='raceDate'){S.draft[t.dataset.in]=t.value;delete UI.errs[t.dataset.in];save();render(true);}
});
/* ========= Inicio ========= */
{const d=load();if(d)adopt(d);}
if(S.answers&&S.plan){UI.view='plan';UI.open=new Set([openWk()]);}
else if(S.draft){UI.view='quiz';}
else UI.view='welcome';
if(!UI.open)UI.open=new Set();
render();
initRemote();
</script>
